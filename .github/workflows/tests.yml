name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily smoke test of the live site
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-api:
    name: Unit + API tests (PyTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-api-results
          path: test-results.xml

  e2e:
    name: Browser tests (Playwright) on the live site
    runs-on: ubuntu-latest
    needs: unit-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e --base-url https://answerweave-ai.vercel.app --tracing retain-on-failure --screenshot only-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
